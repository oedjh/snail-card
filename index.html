<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蝸牛戰牌 - AI 實機測試版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="start-overlay">
    <div class="game-title">🐌 蝸牛戰牌</div>
    <div class="game-subtitle">全螢幕響應式 ＋ 動態音效 ＋ AI 電腦對手</div>
    <div style="display:flex; gap: 15px;">
      <button class="btn-start-game" onclick="startGame(false)">⚔️ 雙人本機對決</button>
      <button class="btn-start-game btn-ai" onclick="startGame(true)">🤖 單人電腦對決</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="left-col">
      <div id="status-bar">
        <div class="status-item" id="phase-txt" style="color:#38bdf8; font-weight:bold;">階段: 準備中</div>
        <div class="status-item" id="turn-txt">輪到: <b style="color:var(--accent);">P1</b></div>
        <div class="status-item" id="kill-txt">擊殺 - P1: 0 | P2: 0</div>
        <div class="status-item" id="grave-txt">墓地: 0張</div>
        <div class="status-item" id="deck-txt">牌庫 - P1: 0 | P2: 0</div>
      </div>
      <div id="log-box"></div>
    </div>

    <div class="center-col">
      <div class="board-container">
        
        <!-- 敵方場地 (P2) -->
        <div class="player-area">
          <div class="area-label" style="justify-content: center; font-weight: bold;">敵方 (P2)</div>
          <div style="display: flex; gap: 8px;">
            <div style="display: flex; flex-direction: column; justify-content: space-around; font-size: 12px; color: #64748b; font-weight: bold; text-align: center; line-height: 1.2;">
              <div>後<br>排</div><div>前<br>排</div>
            </div>
            <div class="grid" style="flex-grow: 1;">
              <div class="slot" id="p2_back_l" onclick="onSlotClick(2, 'back_l')" onmouseenter="hoverBoard(2, 'back_l')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p2_back_r" onclick="onSlotClick(2, 'back_r')" onmouseenter="hoverBoard(2, 'back_r')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p2_front_l" onclick="onSlotClick(2, 'front_l')" onmouseenter="hoverBoard(2, 'front_l')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p2_front_r" onclick="onSlotClick(2, 'front_r')" onmouseenter="hoverBoard(2, 'front_r')" onmouseleave="clearHover()"></div>
            </div>
          </div>
        </div>
        
        <hr class="divider">
        
        <!-- 我方場地 (P1) -->
        <div class="player-area">
          <div style="display: flex; gap: 8px;">
            <div style="display: flex; flex-direction: column; justify-content: space-around; font-size: 12px; color: #64748b; font-weight: bold; text-align: center; line-height: 1.2;">
              <div>前<br>排</div><div>後<br>排</div>
            </div>
            <div class="grid" style="flex-grow: 1;">
              <div class="slot" id="p1_front_l" onclick="onSlotClick(1, 'front_l')" onmouseenter="hoverBoard(1, 'front_l')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p1_front_r" onclick="onSlotClick(1, 'front_r')" onmouseenter="hoverBoard(1, 'front_r')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p1_back_l" onclick="onSlotClick(1, 'back_l')" onmouseenter="hoverBoard(1, 'back_l')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p1_back_r" onclick="onSlotClick(1, 'back_r')" onmouseenter="hoverBoard(1, 'back_r')" onmouseleave="clearHover()"></div>
            </div>
          </div>
          <div class="area-label" style="justify-content: center; font-weight: bold; margin-top: 4px;">我方 (P1)</div>
        </div>
      </div>

      <div id="action-menu" style="flex-direction: column; align-items: center; gap: 8px;">
        <div id="action-target-tip" style="font-size: 13px; color: #38bdf8; font-weight: bold;">正在操作：【卡片名稱】</div>
        <div style="display: flex; gap: 10px;">
          <button class="btn-attack" id="btn-atk" onclick="prepareAction('attack')">⚔️ 發動攻擊</button>
          <button class="btn-skill" id="btn-skill" onclick="prepareAction('skill')">✨ 特殊能力</button>
          <button onclick="cancelAction()">取消選擇</button>
        </div>
      </div>

      <div id="hand-container">
        <div class="area-label">
          <span>手牌區 (點擊以召喚)</span>
          <div class="hand-actions">
            <button class="btn-draw" id="btn-draw" onclick="manualDraw()">🃏 抽 2 張</button>
            <button class="btn-end" onclick="endTurn()">⏩ 結束回合</button>
          </div>
        </div>
        <div id="hand-list"></div>
      </div>
    </div>

    <!-- 右側：卡牌說明 -->
    <div class="right-col" id="info-panel">
      <div class="info-placeholder">游標移至卡牌<br>以查看詳細說明與狀態</div>
    </div>
  </div>

  <script src="cards.js"></script>
  <script src="game.js"></script>
</body>
</html>
