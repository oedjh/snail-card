<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>蝸牛戰牌 - AI 實機測試版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="start-overlay">
    <div class="game-title">🐌 蝸牛戰牌</div>
    <div class="game-subtitle">全螢幕響應式 ＋ 動態音效 ＋ AI 電腦對手</div>
    <div class="start-btn-group">
      <button class="btn-start-game" onclick="startGame(false)">⚔️ 雙人本機對決</button>
      <button class="btn-start-game btn-ai" onclick="startGame(true)">🤖 單人電腦對決</button>
      <button class="btn-start-game btn-tutorial" onclick="startTutorial()">🎓 新手教學</button>
    </div>
  </div>

  <!-- 🌟 手機版長按彈出的「完整卡牌圖鑑彈窗」 -->
  <div id="mobile-card-modal" onclick="closeMobileCardModal()">
    <div class="mobile-card-modal-box" onclick="event.stopPropagation()">
      <div id="mobile-modal-content"></div>
      <button type="button" class="btn-close-modal" onclick="closeMobileCardModal()">知道了</button>
    </div>
  </div>

  <!-- 🌟 返回大廳二次確認視窗 -->
  <div id="confirm-lobby-modal" onclick="if(event.target === this) closeLobbyModal()">
    <div class="confirm-box">
      <div class="confirm-title">🏠 返回遊戲大廳？</div>
      <div class="confirm-desc">目前的對戰進度將會清空，確定要結束這局嗎？</div>
      <div class="confirm-actions">
        <button type="button" class="btn-confirm-cancel" onclick="closeLobbyModal()">繼續戰鬥</button>
        <button type="button" class="btn-confirm-ok" onclick="confirmReturnLobby()">確定返回</button>
      </div>
    </div>
  </div>

  <div class="main-layout">
    <!-- 左側（手機版變身「雙排狀態列 ＋ 內嵌式 2 行即時戰報條」） -->
    <div class="left-col">
      <div id="status-bar">
        <div class="status-item" id="phase-txt" style="color:#38bdf8; font-weight:bold;">階段: 準備中</div>
        <div class="status-item" id="turn-txt">輪到: <b style="color:var(--accent);">P1</b></div>
        <!-- 手機版精巧返回大廳圖示（排在第一列最右側） -->
        <button type="button" class="btn-lobby-mobile mobile-only-btn" onclick="askReturnLobby()" title="返回大廳">🏠</button>

        <div class="status-item" id="kill-txt">擊殺 - P1: 0 | P2: 0</div>
        <div class="status-item" id="grave-txt">墓地: 0張</div>
        <div class="status-item" id="deck-txt">牌庫 - P1: 0 | P2: 0</div>

        <!-- 電腦版返回大廳按鈕 -->
        <button type="button" class="btn-lobby desktop-only-btn" onclick="askReturnLobby()">🏠 返回大廳</button>
      </div>

      <!-- 戰報區：電腦版佔滿左欄，手機版直接內嵌成 2 行可滑動即時播報條！ -->
      <div id="log-box"></div>
    </div>

    <!-- 中間：戰鬥區與手牌 -->
    <div class="center-col">
      <div id="tutorial-banner" style="display: none;">
        <div class="tutorial-icon">🐌</div>
        <div class="tutorial-content">
          <div id="tutorial-title" class="tutorial-title">任務 1：教學準備中...</div>
          <div id="tutorial-desc" class="tutorial-desc">💡 提示內容載入中</div>
        </div>
        <button class="btn-exit-tutorial" onclick="exitTutorial()">✕ 退出教學</button>
      </div>

      <div class="board-container">
        <!-- 敵方場地 (P2) -->
        <div class="player-area">
          <div class="area-label" style="justify-content: center; font-weight: bold;">敵方 (P2) <span class="mobile-hint-tag">（長按卡牌看詳情）</span></div>
          <div style="display: flex; gap: 6px; flex: 1 1 0; min-height: 0;">
            <div class="row-indicator">
              <div>後<br>排</div><div>前<br>排</div>
            </div>
            <div class="grid" style="flex-grow: 1;">
              <div class="slot" id="p2_back_l" onclick="onSlotClick(2, 'back_l')" onmouseenter="hoverBoard(2, 'back_l')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p2_back_r" onclick="onSlotClick(2, 'back_r')" onmouseenter="hoverBoard(2, 'back_r')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p2_front_l" onclick="onSlotClick(2, 'front_l')" onmouseenter="hoverBoard(2, 'front_l')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p2_front_r" onclick="onSlotClick(2, 'front_r')" onmouseenter="hoverBoard(2, 'front_r')" onmouseleave="clearHover()"></div>
            </div>
          </div>
        </div>
        
        <hr class="divider">
        
        <!-- 我方場地 (P1) -->
        <div class="player-area">
          <div style="display: flex; gap: 6px; flex: 1 1 0; min-height: 0;">
            <div class="row-indicator">
              <div>前<br>排</div><div>後<br>排</div>
            </div>
            <div class="grid" style="flex-grow: 1;">
              <div class="slot" id="p1_front_l" onclick="onSlotClick(1, 'front_l')" onmouseenter="hoverBoard(1, 'front_l')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p1_front_r" onclick="onSlotClick(1, 'front_r')" onmouseenter="hoverBoard(1, 'front_r')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p1_back_l" onclick="onSlotClick(1, 'back_l')" onmouseenter="hoverBoard(1, 'back_l')" onmouseleave="clearHover()"></div>
              <div class="slot" id="p1_back_r" onclick="onSlotClick(1, 'back_r')" onmouseenter="hoverBoard(1, 'back_r')" onmouseleave="clearHover()"></div>
            </div>
          </div>
          <div class="area-label" style="justify-content: center; font-weight: bold; margin-top: 2px;">我方 (P1)</div>
        </div>
      </div>

      <!-- 操作選單（手機版會自動帶出該卡技能摘要！） -->
      <div id="action-menu" style="flex-direction: column; align-items: center; gap: 6px;">
        <div id="action-target-tip" style="font-size: 13px; color: #38bdf8; font-weight: bold;">正在操作：【卡片名稱】</div>
        <div id="mobile-inline-skill" class="mobile-inline-skill"></div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
          <button class="btn-attack" id="btn-atk" onclick="prepareAction('attack')">⚔️ 發動攻擊</button>
          <button class="btn-skill" id="btn-skill" onclick="prepareAction('skill')">✨ 特殊能力</button>
          <button onclick="cancelAction()">取消選擇</button>
        </div>
      </div>

      <!-- 手牌區（選取手牌時也會直接在上方顯示該手牌技能摘要！） -->
      <div id="hand-container">
        <div class="area-label">
          <span>手牌區 (點擊召喚)</span>
          <div class="hand-actions">
            <button class="btn-draw" id="btn-draw" onclick="manualDraw()">🃏 抽 2 張</button>
            <button class="btn-end" onclick="endTurn()">⏩ 結束回合</button>
          </div>
        </div>
        <div id="mobile-hand-skill-preview" class="mobile-inline-skill"></div>
        <div id="hand-list"></div>
      </div>
    </div>

    <!-- 右側：電腦版專屬卡牌說明欄 -->
    <div class="right-col" id="info-panel">
      <div class="info-placeholder">游標移至卡牌<br>以查看詳細說明與狀態</div>
    </div>
  </div>

  <script src="cards.js"></script>
  <script src="game.js"></script>
  <script src="tutorial.js"></script>

  <!-- 🌟 手機無縫交互引擎：長按看大卡 + 即時技能摘要 + 返回大廳 + 雙重防選字 -->
  <script>
    function askReturnLobby() {
      document.getElementById('confirm-lobby-modal').classList.add('open');
    }
    function closeLobbyModal() {
      document.getElementById('confirm-lobby-modal').classList.remove('open');
    }
    function confirmReturnLobby() {
      closeLobbyModal();
      const tutBanner = document.getElementById('tutorial-banner');
      if (tutBanner && tutBanner.style.display !== 'none' && typeof exitTutorial === 'function') {
        exitTutorial();
        return;
      }
      if (typeof resetGameToLobby === 'function') {
        resetGameToLobby();
      } else {
        document.getElementById('start-overlay').style.display = 'flex';
      }
    }

    function openMobileCardModal(card) {
      if (!card) return;
      let statusHtml = '';
      if (card.isSealed) statusHtml += `<div class="info-status" style="display:block;">⚠️ 此卡已被【封印】，失去所有特殊效果。</div>`;
      if (card.quickBuff) statusHtml += `<div class="info-status" style="display:block; background:rgba(56,189,248,0.1); color:#38bdf8;">⚡ 目前擁有【速攻】狀態</div>`;
      if (card.isBurrowed) statusHtml += `<div class="info-status" style="display:block; background:rgba(234,179,8,0.1); color:#eab308;">🪱 目前處於【遁地】狀態</div>`;
      const nameColor = typeof getRarityColor === 'function' ? getRarityColor(card.rarity) : '#fff';

      document.getElementById('mobile-modal-content').innerHTML = `
        <div class="info-name" style="color: ${nameColor};">${card.name}</div>
        <div class="info-tags">[ ${card.rarity} | ${card.tags} ]</div>
        <div class="info-stats-box">
          <div class="info-stat"><span class="info-stat-value atk">⚔️ ${card.atk}</span><span class="info-stat-label">攻擊力</span></div>
          <div class="info-stat"><span class="info-stat-value hp">❤️ ${card.hp}/${card.maxHp}</span><span class="info-stat-label">生命值</span></div>
        </div>
        <div class="info-desc-title">卡牌效果說明</div>
        <div class="info-desc">${card.skillDesc || '這是一張沒有特殊效果的卡牌。'}</div>
        ${statusHtml}
      `;
      document.getElementById('mobile-card-modal').classList.add('open');
    }

    function closeMobileCardModal() {
      document.getElementById('mobile-card-modal').classList.remove('open');
    }

    let pressTimer = null;
    let isLongPressTriggered = false;

    function resolveCardFromTarget(target) {
      const slotEl = target.closest('.slot');
      if (slotEl && slotEl.id && typeof board !== 'undefined') {
        const parts = slotEl.id.split('_');
        const p = parseInt(parts[0].replace('p', ''), 10);
        const slotKey = parts.slice(1).join('_');
        return board[p] ? board[p][slotKey] : null;
      }
      const handCardEl = target.closest('.hand-card');
      if (handCardEl && typeof hands !== 'undefined' && typeof turn !== 'undefined') {
        const idx = Array.from(document.getElementById('hand-list').children).indexOf(handCardEl);
        return (idx >= 0 && hands[turn]) ? hands[turn][idx] : null;
      }
      return null;
    }

    // 🌟 徹底封印 Android Chrome 長按觸發系統選字/右鍵選單
    document.addEventListener('contextmenu', (e) => {
      if (window.innerWidth <= 768 && resolveCardFromTarget(e.target)) {
        e.preventDefault();
      }
    });

    document.addEventListener('touchstart', (e) => {
      if (window.innerWidth > 768) return;
      const card = resolveCardFromTarget(e.target);
      if (!card) return;
      isLongPressTriggered = false;
      pressTimer = setTimeout(() => {
        isLongPressTriggered = true;
        if (navigator.vibrate) navigator.vibrate(25);
        openMobileCardModal(card);
      }, 350);
    }, { passive: true });

    ['touchend', 'touchmove', 'touchcancel'].forEach(evt => {
      document.addEventListener(evt, () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      }, { passive: true });
    });

    document.addEventListener('click', (e) => {
      if (isLongPressTriggered) {
        e.stopPropagation();
        e.preventDefault();
        isLongPressTriggered = false;
        return;
      }
      if (window.innerWidth <= 768) {
        setTimeout(syncMobileInlineTips, 10);
      }
    }, true);

    function syncMobileInlineTips() {
      const actionSkillEl = document.getElementById('mobile-inline-skill');
      if (typeof activeSlot !== 'undefined' && activeSlot && typeof board !== 'undefined' && board[turn][activeSlot]) {
        const c = board[turn][activeSlot];
        actionSkillEl.textContent = c.skillDesc || '無特殊效果';
        actionSkillEl.style.display = 'block';
      } else {
        actionSkillEl.style.display = 'none';
      }

      const handSkillEl = document.getElementById('mobile-hand-skill-preview');
      if (typeof selectedHandIndex !== 'undefined' && selectedHandIndex !== null && typeof hands !== 'undefined' && hands[turn][selectedHandIndex]) {
        const hc = hands[turn][selectedHandIndex];
        handSkillEl.textContent = `【${hc.name}】${hc.skillDesc || '無特殊效果'}`;
        handSkillEl.style.display = 'block';
      } else {
        handSkillEl.style.display = 'none';
      }
    }
  </script>
</body>
</html>
